# manifest.yaml — Tooling metadata for matlab-modernize-code
schema-version: 1
license: https://www.mathworks.com/content/dam/mathworks/license/pmrl/license.md
scope: cross-product
version: "1.3"
human-description: Modernize removed or discouraged MATLAB functions and patterns.
# Floor = newest release among the modern replacements the skill recommends
# (trainnet/dlnetwork R2024a, dictionary R2022b, spectralKurtosis R2024b). On
# R2024b+ every recommended replacement exists; below it the advice breaks.
matlab-release: ">=R2024b"
required-tools:
  - evaluate_matlab_code
  - check_matlab_code
required-skills: []
required-products: []
# Enhancing toolboxes: the always-loaded SKILL.md body is core-MATLAB only, but the
# on-demand references/*.md domain files teach functions from these products. None is
# required for the skill's core value; each enhances coverage in its domain.
optional-products:
  - Deep Learning Toolbox
  - Mapping Toolbox
  - Signal Processing Toolbox
  - Image Processing Toolbox
  - Statistics and Machine Learning Toolbox
toolkit: matlab-agentic-toolkit
